name: Documentation problem
description: Report missing, incorrect, or unclear Aldus documentation
title: "[Docs]: "
labels:
  - documentation
  - "needs triage"
body:
  - type: dropdown
    id: audience
    attributes:
      label: Who is the documentation for?
      options:
        - Reader or listener
        - Server administrator or self-hoster
        - Contributor
        - More than one audience
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Page or file
      description: Paste the documentation URL or repository file path.
      placeholder: "https://aldus.media/..."
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Optional. Describe what would have made the page work for you.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this documentation problem.
          required: true
