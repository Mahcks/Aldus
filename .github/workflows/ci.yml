name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: make -C .. fixture
      - run: make -C .. generate-check
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.0 run --no-config --enable-only rowserrcheck ./...
      - run: go test ./...
      - run: go test ./internal/api -run TestExactProgressCrossClientAcceptance -count=1
      - run: go test -race ./...
      - run: go build ./...

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:web

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
        working-directory: app
      - run: make fixture
      - run: bunx playwright install --with-deps chromium
        working-directory: app
      - run: bun run test:e2e
        working-directory: app

  koreader-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: make fixture
      - run: bun install --frozen-lockfile
        working-directory: app
      - run: bunx playwright install --with-deps chromium
        working-directory: app
      - run: make koreader-acceptance
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: koreader-acceptance
          path: artifacts/ecosystem/
          if-no-files-found: warn

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: ./scripts/release.sh self-test
      - name: Verify published migrations are immutable
        id: previous
        shell: bash
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          if [[ -z "$previous" ]]; then
            echo "image=" >> "$GITHUB_OUTPUT"
            echo "schema_upgrade=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=0
          while IFS= read -r file; do
            git show "$previous:$file" | cmp - "$file" || changed=1
          done < <(git ls-tree -r --name-only "$previous" -- server/internal/database/migrations)
          test "$changed" = 0 || {
            echo "Published migration files are immutable; add a new numbered migration instead." >&2
            exit 1
          }
          previous_count=$(git ls-tree -r --name-only "$previous" -- server/internal/database/migrations | wc -l)
          current_count=$(find server/internal/database/migrations -type f -name '*.sql' | wc -l)
          echo "image=ghcr.io/mahcks/aldus:${previous#v}" >> "$GITHUB_OUTPUT"
          if [[ $current_count -gt $previous_count ]]; then
            echo "schema_upgrade=1" >> "$GITHUB_OUTPUT"
          else
            echo "schema_upgrade=0" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: aldus:ci
          cache-from: type=gha,scope=alignment
          cache-to: type=gha,mode=max,scope=alignment
      - run: ./scripts/check-alignment-image.sh aldus:ci cpu
      - run: make release-smoke IMAGE=aldus:ci
        env:
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
          EXPECT_SCHEMA_UPGRADE: ${{ steps.previous.outputs.schema_upgrade }}

  docker-cuda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space for the CUDA image
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - run: docker build --target alignment-nvidia --tag aldus:ci-cuda .
      - run: ./scripts/check-alignment-image.sh aldus:ci-cuda cuda

  docker-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: aldus:ci-arm64
          cache-from: type=gha,scope=alignment-arm64
          cache-to: type=gha,mode=max,scope=alignment-arm64
      - run: ./scripts/check-alignment-image.sh aldus:ci-arm64 cpu
