name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="${GITHUB_SHA}" \
            -f status=success \
            --jq '.total_count')
          test "$count" -gt 0 || {
            echo "CI has not succeeded for ${GITHUB_SHA}" >&2
            exit 1
          }

  standard:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release configuration
        run: test "$(sed -n 's/^ALDUS_VERSION=//p' .env.example)" = "${GITHUB_REF_NAME#v}"
      - name: Free disk space for the standard image
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/mahcks/aldus
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=alignment
          cache-to: type=gha,mode=max,scope=alignment

  cuda:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space for the CUDA image
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/mahcks/aldus
          tags: type=semver,pattern={{version}},suffix=-cuda
          labels: |
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: alignment-nvidia
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=alignment-nvidia
          cache-to: type=gha,mode=max,scope=alignment-nvidia

  publish:
    needs: [standard, cuda]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Free disk space for exact-image verification
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Verify exact public images
        id: images
        run: |
          image="ghcr.io/mahcks/aldus:${GITHUB_REF_NAME#v}"
          manifest=$(docker manifest inspect "$image")
          grep -q '"architecture": "amd64"' <<<"$manifest"
          grep -q '"architecture": "arm64"' <<<"$manifest"
          docker manifest inspect "${image}-cuda" >/dev/null
          docker pull "$image"
          EXPECTED_VERSION="${GITHUB_REF_NAME}" make release-smoke IMAGE="$image"
          standard_digest=$(docker buildx imagetools inspect "$image" | awk '$1 == "Digest:" { print $2; exit }')
          cuda_digest=$(docker buildx imagetools inspect "${image}-cuda" | awk '$1 == "Digest:" { print $2; exit }')
          [[ $standard_digest == sha256:* && $cuda_digest == sha256:* ]]
          echo "standard_digest=$standard_digest" >> "$GITHUB_OUTPUT"
          echo "cuda_digest=$cuda_digest" >> "$GITHUB_OUTPUT"
      - name: Publish release notes and Compose files
        env:
          GH_TOKEN: ${{ github.token }}
          STANDARD_IMAGE_DIGEST: ${{ steps.images.outputs.standard_digest }}
          CUDA_IMAGE_DIGEST: ${{ steps.images.outputs.cuda_digest }}
        run: |
          ./scripts/release.sh notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          prerelease=()
          [[ "${GITHUB_REF_NAME}" == *-* ]] && prerelease=(--prerelease)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --title "Aldus ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --title "Aldus ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/release-notes.md" "${prerelease[@]}"
          fi
          gh release upload "${GITHUB_REF_NAME}" compose.yml compose.gpu.yml --clobber
