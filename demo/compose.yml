services:
  aldus:
    image: ghcr.io/mahcks/aldus:${ALDUS_VERSION:?Set ALDUS_VERSION to a published immutable release}
    restart: unless-stopped
    environment:
      ALDUS_ENV: production
      ALDUS_DATA_DIR: /data
      ALDUS_SOURCE_ROOTS: /library/demo
      ALDUS_SECURE_COOKIES: "true"
      ALDUS_ALLOWED_ORIGINS: https://demo.aldus.media
      ALDUS_DEMO_LIBRARY_ID: ${ALDUS_DEMO_LIBRARY_ID:-}
      ALDUS_TRUST_PROXY_HEADERS: "true"
    volumes:
      - ./data:/data
      - ./media:/library/demo:ro
      - ./backups:/backups
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    tmpfs:
      - /tmp

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      aldus:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
